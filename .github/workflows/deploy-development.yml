name: Deploy Forge (development)

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: forge-deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/hello-world/package-lock.json

      - name: Install Forge CLI
        run: |
          npm install -g @forge/cli
          forge --version

      - name: Install root dependencies
        run: npm ci

      - name: Install & build front app
        working-directory: static/hello-world   # adapte à ton chemin
        run: |
          npm ci
          npm run build

      - name: Deploy to Forge (development)
        run: forge deploy --non-interactive --environment development